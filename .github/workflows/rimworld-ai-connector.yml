name: RimWorld AI connector

# Builds the pinned RimBridge mod from source (no game install needed), runs its unit tests,
# builds and tests the MCP server, checks the generated tool reference is current, and
# uploads the installable mod folder as an artifact.

on:
  workflow_dispatch:
  push:
    paths:
      - 'rimworld-ai-connector/**'
      - '.github/workflows/rimworld-ai-connector.yml'
  pull_request:
    paths:
      - 'rimworld-ai-connector/**'
      - '.github/workflows/rimworld-ai-connector.yml'

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1

jobs:
  mod:
    name: RimBridge mod (pinned build + upstream tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build, test, package
        run: rimworld-ai-connector/mod/scripts/build-mod.sh
      - name: Harmony targets exist in the game assemblies
        run: rimworld-ai-connector/mod/scripts/check-harmony-targets.sh
      - name: Upload mod folder
        uses: actions/upload-artifact@v4
        with:
          name: RimBridge-mod
          path: rimworld-ai-connector/mod/dist/RimBridge/
          if-no-files-found: error

  mcp:
    name: MCP server (build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rimworld-ai-connector/mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rimworld-ai-connector/mcp/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Tool reference is up to date
        run: |
          npm run tools-doc
          git diff --exit-code -- ../docs/TOOLS.md || { echo "docs/TOOLS.md is stale: run 'npm run tools-doc' in rimworld-ai-connector/mcp and commit"; exit 1; }
      - name: Server starts and prints help
        run: node dist/index.js --help
      - name: Tool schemas match the mod's parameter parsing
        run: |
          REF=$(grep -oE 'RB_REF:-[0-9a-f]+' ../mod/scripts/build-mod.sh | cut -d- -f2)
          git init -q ../mod/.work/rimbridge
          git -C ../mod/.work/rimbridge remote add origin https://github.com/zorrobyte/rimbridge.git
          git -C ../mod/.work/rimbridge fetch -q --depth 1 origin "$REF"
          git -C ../mod/.work/rimbridge checkout -q --detach FETCH_HEAD
          npm run audit -- ../mod/.work/rimbridge/Source
